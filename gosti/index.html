<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Список покупок — Ждём гостей</title><meta name="theme-color" content="#C45A38">
<style>
body{margin:0;background:#FAF5EE;color:#33261E;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(140deg,#C45A38,#E5A25B);color:#fff;padding:22px 18px 18px}
h1{margin:0;font:600 26px Georgia,serif}main{max-width:560px;margin:0 auto;padding:10px 14px 90px}
.d{margin:18px 4px 6px;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#8C796B}
.i{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px;margin-bottom:6px;box-shadow:0 1px 2px rgba(96,58,33,.06);cursor:pointer}
.i.on{opacity:.5}.i.on .n{text-decoration:line-through}.c{width:24px;height:24px;border-radius:8px;border:2px solid #E2D5C7;flex:none;display:grid;place-items:center;color:#fff;font-weight:700}
.i.on .c{background:#5E8C61;border-color:#5E8C61}.n{flex:1;font-weight:500}.q{font-weight:600;white-space:nowrap}
.app{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #EDE2D6;padding:12px 14px;display:flex;gap:12px;align-items:center}
.app a{background:#C45A38;color:#fff;text-decoration:none;font-weight:600;padding:11px 16px;border-radius:12px;white-space:nowrap}
.m{color:#8C796B;text-align:center;padding:40px 10px}
</style></head><body>
<header><h1 id="t">Список покупок</h1><div id="s">Отмечайте купленное — все видят сразу</div></header>
<main id="l"><p class="m">Загружаем…</p></main>
<div class="app"><div style="flex:1;font-size:13px"><b>Ждём гостей</b><br>меню, покупки и план готовки по часам</div><a href="https://www.rustore.ru/catalog/app/ru.gurdoc.gosti">Установить</a></div>
<script>
const API = 'https://functions.yandexcloud.net/d4enk5qbd776la17mteu'; // адрес функции Yandex Cloud
const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let L = null;
const api = b => fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(r => r.json());
function draw() {
  if (!L) return; $('t').textContent = L.title || 'Список покупок';
  const it = Object.entries(L.items), left = it.filter(([, x]) => !x.ch).length; $('s').textContent = `Код ${code} · осталось купить: ${left} из ${it.length}`;
  let d = '', h = ''; for (const [k, x] of it) { if (x.d !== d) { d = x.d; h += `<div class="d">${esc(d)}</div>`; }
    h += `<div class="i ${x.ch ? 'on' : ''}" data-k="${esc(k)}"><div class="c">${x.ch ? '✓' : ''}</div><div class="n">${esc(x.n)}</div><div class="q">${esc(x.q || '')}</div></div>`; }
  $('l').innerHTML = h;
}
async function load() { try { const j = await api({ a: 'get', c: code }); if (!j.ok) throw new Error(j.err); L = j; draw(); } catch (e) { if (!L) $('l').innerHTML = '<p class="m">Список не найден. Проверьте ссылку.</p>'; } }
$('l').onclick = async e => { const el = e.target.closest('.i'); if (!el || !L) return; const k = el.dataset.k; L.items[k].ch = !L.items[k].ch; draw(); api({ a: 'set', c: code, k, v: L.items[k].ch }); };
if (!code || !API) $('l').innerHTML = '<p class="m">Откройте ссылку, которую прислали в мессенджере.</p>'; else { load(); setInterval(() => !document.hidden && load(), 8000); }
</script></body></html>
